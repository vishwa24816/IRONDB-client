[package]
name = "irondb-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "process", "net", "io-util"] }
reqwest = { version = "0.13.5", features = ["json"] }
futures = "0.3.34"
secrecy = "0.10.3"
async-openai = { version = "0.42.2", features = ["chat-completion"] }
russh = { version = "0.64.1", features = ["aws-lc-rs"] }
ssh-key = "0.6"
url = "2.5.8"
tokio-cron-scheduler = "0.15"
calamine = "0.36"
rust_xlsxwriter = "0.99"
sha2 = "0.10"
chrono = "0.4"
tokio-rusqlite = "0.8"
rmcp = "=3.5.1"
totp-rs = "=5.7.2"
