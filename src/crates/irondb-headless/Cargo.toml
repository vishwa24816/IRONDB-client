[package]
name = "irondb-headless"
version = "0.1.0"
edition = "2021"

[lib]
name = "irondb_headless"
path = "src/lib.rs"

[[bin]]
name = "irondb-headless"
path = "src/main.rs"

[dependencies]
irondb-facade = { path = "../irondb-facade" }
irondb-contracts = { path = "../irondb-contracts" }
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "=0.6.11", features = ["limit", "timeout", "trace"] }
tower = { version = "0.5.3", features = ["timeout", "limit"] }
axum = "=0.8.9"
anyhow = "1.0.104"
tower-sessions = "=0.15.0"
totp-rs = { version = "=5.7.2", features = ["otpauth"] }
sha2 = "=0.10.9"

[dev-dependencies]
irondb-store = { path = "../irondb-store" }
tokio-rusqlite = "0.8"
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
