[package]
name = "irondb-datasources"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
irondb-drivers = { path = "../irondb-drivers" }
irondb-sidecar = { version = "0.1.0", path = "../irondb-sidecar" }
mongodb = { version = "3.9.1", features = ["sync", "bson-3"] }
odbc-api = "29"
redis = { version = "1.7.1", features = ["tokio-comp"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "postgres", "derive"], default-features = false }
tiberius = { version = "0.13.0", features = ["rustls", "time", "serde", "chrono", "rust_decimal"], default-features = false }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rusqlite = "0.8.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
