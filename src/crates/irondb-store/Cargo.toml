[package]
name = "irondb-store"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rusqlite = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
